# Opciones comunes a todas las presentaciones de esta carpeta
format:
  revealjs:
    theme: [default, ../assets/diapositivas.scss]
    width: 1600
    height: 900
    margin: 0.05
    min-scale: 0.2
    max-scale: 2.0
    center: false
    slide-number: c/t
    show-slide-number: all
    hash-type: number
    history: true
    transition: fade
    background-transition: fade
    controls: true
    controls-layout: bottom-right
    progress: true
    preview-links: auto
    code-copy: true
    code-line-numbers: false
    highlight-style: ../assets/paleta.theme
    link-external-newwindow: true
    chalkboard:
      buttons: false
      theme: whiteboard
    menu:
      side: left
      width: wide
      numbers: true
    footer: "Escuela de Machine Learning · Honduras 2026"
    fig-align: center
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

date-format: "dddd D [de] MMMM [de] YYYY"

jupyter: python3

execute:
  echo: false
  warning: false
  message: false
